<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Nav</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topnav">
      <a href="home" aria-label="LinkedIn home">
        <img src="images/linkedin-logo.png" alt="LinkedIn" class="logo">
      </a>

      <input class="search" type="search" >

      <nav class="nav1" aria-label="Main navigation">
        <a class="active" href="#home">
          <img src="images/icons8-home-50.png" alt="" class="nav-icon"><span>Home</span>
        </a>
        <a class="active" href="network">
            <img src="images/icons8-users-24.png" alt="" class="nav-icon"></span>My Network</span>
        </a>
        <a class="active" href="jobs">
          <img src="images/icons8-briefcase-24.png" alt="" class="nav-icon"><span>Jobs</span>
        </a>
        <a class="active" href="messaging">
          <img src="images/icons8-chat-24.png" alt="" class="nav-icon"></span>Messaging</span>
        </a>
        <a class="active" href="notifications">
          <img src="images/icons8-notification.gif" alt="" class="nav-icon"></span>Notifications</span>
        </a>
        <a class="active" href="me">Me</a>

      </nav>
    </header>
</body>
</html>
